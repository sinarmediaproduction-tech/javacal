<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Jawa - Neptu, Hijriyah & Hari Baik</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#d32f2f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Kalender Jawa">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap');

        /* --- LAYAR --- */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f0f0;
            padding: 10px;
            /* Desain dikunci di 1000px: zoom in/out browser hanya memperbesar/memperkecil,
               tidak mengubah tata letak. Jika jendela lebih sempit, halaman bisa digeser. */
            min-width: 1000px;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        #stageBox {
            width: 1000px;
            margin: 0 auto;
        }
        #stage {
            width: 1000px;
            transform-origin: 0 0;
        }

        .month-title-btn {
            font-family: 'Oswald', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #000;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            line-height: 1;
        }
        .nav-arrow { display: none; }
        .year-title-btn {
            font-family: 'Oswald', sans-serif;
            font-size: 44px;
            font-weight: 700;
            color: #d32f2f;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            line-height: 1;
        }

        .calendar-wrapper {
            background-color: #fff;
            width: 1000px;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        /* --- EXTRA MENU (di luar calendar-wrapper, TIDAK ikut ter-capture PDF) --- */
        .extra-menu-container {
            background-color: #fff;
            width: 1000px;
            margin-top: 14px;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            background-color: #ccc;
        }
        .extra-menu-item {
            flex: 1 1 0;
            min-width: 120px;
            background-color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #000;
            text-align: center;
            padding: 14px 8px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .extra-menu-item:hover {
            background-color: #d32f2f;
            color: #fff;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 2px 12px;
            height: 85px;
            box-sizing: border-box;
            overflow: hidden;
            border: none;
        }

        .header-left,
        .header-center,
        .header-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
            justify-content: center;
        }
        .header-left {
            align-items: flex-start;
        }
        .header-right {
            align-items: flex-end;
        }
        .header-center {
            align-items: center;
            gap: 2px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr) 1.5fr repeat(5, 1fr);
            border-bottom: 1px solid #000;
            border-left: 1px solid #ccc;
        }

        .calendar-grid .date-cell:first-child,
        .calendar-grid .day-name:first-child {
            border-left: 1px solid #ccc;
        }
        .calendar-grid .day-name:first-child {
            border-left: 1px solid #fff;
        }
        .calendar-grid .date-cell:last-child,
        .calendar-grid .day-name:last-child {
            border-right: 1px solid #ccc;
        }
        .calendar-grid .day-name:last-child {
            border-right: 1px solid #fff;
        }

        .wuku-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(5, 1fr) 1.5fr repeat(5, 1fr);
            background-color: #e0e0e0;
            font-size: 9px;
            text-align: center;
            font-weight: bold;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
            border-left: 1px solid #000;
            margin-left: -1px; /* sejajar dengan garis kiri .calendar-grid; lebar kolom tetap sama */
        }
        .wuku-cell {
            border-right: 1px solid #fff;
            padding: 2px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }
        .wuku-cell:first-child {
            border-left: none;
        }
        .wuku-cell:last-child {
            border-right: 1px solid #000; /* di dalam track, bukan memperkecil lebar baris */
        }
        .wuku-cell.wuku-split {
            font-size: 7px;
            letter-spacing: -0.2px;
            line-height: 1.1;
            padding: 1px 0;
        }
        .wuku-center {
            background-color: #fff;
            letter-spacing: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .day-name {
            background-color: #000;
            color: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: calc(22px + 1pt);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .day-minggu {
            background-color: #d32f2f;
            cursor: pointer;
        }

        .date-cell {
            position: relative;
            border-right: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2px 0;
        }
        .date-cell.has-date {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .date-cell.has-date:hover {
            background-color: #f2f2f2;
        }
        .big-number {
            font-family: 'Oswald', sans-serif;
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
            color: #000;
            margin-bottom: 6px;
        }
        .red-text {
            color: #d32f2f;
        }
        .green-text {
            color: #2e7d32;
        }
        .faded-text {
            color: #aaa;
        }

        .jav-date {
            font-size: 9px;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            color: #000;
            font-weight: bold;
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .jav-date.good-day {
            color: #2e7d32;
        }
        .jav-date.bad-day {
            color: #d32f2f;
        }
        .jav-date.red-text {
            color: #d32f2f !important;
        }

        .neptu-label {
            font-size: 8px;
            position: absolute;
            bottom: 2px;
            left: 4px;
            color: #555;
            font-weight: bold;
        }
        .neptu-label.red-text {
            color: #d32f2f;
        }

        .hijri-date {
            font-size: 7px;
            position: absolute;
            top: 2px;
            right: 4px;
            color: #777;
            font-weight: normal;
            letter-spacing: 0.2px;
        }
        .hijri-date.red-text {
            color: #d32f2f;
        }

        .split-cell {
            position: relative;
        }
        .split-top-left {
            font-size: 16px;
            position: absolute;
            top: 2px;
            left: 4px;
        }
        .split-bottom-right {
            font-size: 20px;
            position: absolute;
            bottom: 4px;
            right: 4px;
        }
        .split-jav-top {
            font-size: 7px;
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-weight: bold;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .split-jav-top.good-day {
            color: #2e7d32;
        }
        .split-jav-top.bad-day {
            color: #d32f2f;
        }
        .split-jav-top.red-text {
            color: #d32f2f !important;
        }

        .split-jav-bottom {
            font-size: 7px;
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-weight: bold;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .split-jav-bottom.good-day {
            color: #2e7d32;
        }
        .split-jav-bottom.bad-day {
            color: #d32f2f;
        }
        .split-jav-bottom.red-text {
            color: #d32f2f !important;
        }

        .split-hijri-top {
            font-size: 6px;
            position: absolute;
            top: 2px;
            right: 4px;
            color: #777;
            font-weight: normal;
        }
        .split-hijri-top.red-text {
            color: #d32f2f;
        }
        .split-hijri-bottom {
            font-size: 6px;
            position: absolute;
            bottom: 2px;
            right: 4px;
            color: #777;
            font-weight: normal;
        }
        .split-hijri-bottom.red-text {
            color: #d32f2f;
        }

        .footer {
            padding: 6px 8px;
            font-size: 8px;
            background-color: #fafafa;
            color: #000;
            border: none;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px 8px;
            align-items: start;
            width: 100%;
            overflow: hidden;
        }
        .footer-col {
            text-align: left;
            overflow: hidden;
            word-break: break-word;
        }
        .footer-col.center {
            text-align: left;
        }
        .footer p {
            margin: 2px 0;
        }
        .holiday-red {
            color: #d32f2f;
            font-weight: bold;
        }

        .mangsa-item {
            margin-bottom: 2px;
            line-height: 1.2;
        }
        .mangsa-item strong {
            color: #000;
        }
        .mangsa-item .label {
            font-weight: bold;
            color: #555;
        }
        .mangsa-item .kejadian {
            color: #d32f2f;
            font-weight: bold;
        }
        .mangsa-item .rentang {
            color: #555;
            font-size: 7px;
        }
        .mangsa-item .filosofi {
            font-style: italic;
            color: #2c3e50;
            font-size: 7px;
            display: block;
            margin-top: 1px;
        }

        .month-info-left {
            font-size: 8px;
            color: #000;
            text-align: left;
            font-weight: normal;
            letter-spacing: 0;
            line-height: 1.1;
            width: 100%;
        }
        .month-info-left .line1 {
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            color: #000;
        }
        .month-info-left .line2 {
            font-size: 9px;
            color: #333;
        }
        .month-info-left .line3 {
            font-size: 9px;
            color: #555;
            font-weight: normal;
        }
        .month-info-left .tahun-jawa {
            color: #d32f2f;
            font-weight: bold;
        }

        .month-info-right {
            font-size: 8px;
            color: #000;
            text-align: right;
            font-weight: normal;
            letter-spacing: 0;
            line-height: 1.1;
            width: 100%;
        }
        .month-info-right .line1 {
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
            color: #000;
        }
        .month-info-right .line2 {
            font-size: 9px;
            color: #333;
        }
        .month-info-right .line3 {
            font-size: 9px;
            color: #555;
            font-weight: normal;
        }
        .month-info-right .tahun-jawa {
            color: #d32f2f;
            font-weight: bold;
        }

        .windu-sancaya {
            background-color: #000;
            color: #fff;
            padding: 1px 10px;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 1px;
            border-radius: 0px;
            text-transform: uppercase;
            font-family: 'Oswald', sans-serif;
            border: 1px solid #000;
            white-space: nowrap;
            line-height: 1.2;
        }
        .windu-sancaya .tahun-windu {
            color: #fff;
            font-size: 11px;
        }

        /* Modal untuk memilih tanggal */
        .date-picker-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .date-picker-modal.active {
            display: flex;
        }
        .date-picker-box {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        .date-picker-box h3 {
            margin: 0 0 15px 0;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
        }
        .date-picker-box input {
            font-size: 18px;
            padding: 8px 12px;
            border: 2px solid #ccc;
            border-radius: 4px;
            width: 200px;
            text-align: center;
            margin-bottom: 15px;
        }
        .date-picker-box .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .date-picker-box button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .date-picker-box .btn-go {
            background-color: #d32f2f;
            color: #fff;
        }
        .date-picker-box .btn-go:hover {
            background-color: #b71c1c;
        }
        .date-picker-box .btn-cancel {
            background-color: #ccc;
            color: #000;
        }
        .date-picker-box .btn-cancel:hover {
            background-color: #aaa;
        }

        /* Box untuk modal Detail Hari Ini */
        .day-detail-box {
            background-color: #fff;
            padding: 22px 26px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
            max-width: 88vw;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .day-detail-box h3 {
            margin: 0 0 2px 0;
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #999;
        }
        .tdd-daybig {
            font-family: 'Oswald', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #d32f2f;
            text-transform: uppercase;
            line-height: 1.15;
        }
        .tdd-dateline {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .tdd-holiday {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background-color: #d32f2f;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .tdd-grid {
            text-align: left;
            margin-top: 10px;
            border-top: 1px solid #eee;
        }
        .tdd-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 7px 0;
            border-bottom: 1px solid #eee;
        }
        .tdd-label {
            color: #999;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .tdd-value {
            text-align: right;
            font-weight: 700;
            font-size: 13px;
            color: #000;
        }
        .tdd-value.tdd-good {
            color: #2e7d32;
        }
        .tdd-value.tdd-bad {
            color: #d32f2f;
        }
        .tdd-status {
            margin-top: 14px;
            padding: 8px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 12px;
            color: #fff;
        }
        .tdd-status.tdd-good-bg {
            background-color: #2e7d32;
        }
        .tdd-status.tdd-bad-bg {
            background-color: #d32f2f;
        }

        /* Box untuk modal Form Libur Nasional Manual */
        .holiday-form-box {
            background-color: #fff;
            padding: 24px 28px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 360px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .holiday-form-box h3 {
            margin: 0 0 15px 0;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
        }
        .holiday-form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: left;
            margin-bottom: 14px;
        }
        .holiday-form-row label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }
        .holiday-form-row input {
            font-size: 14px;
            padding: 8px 10px;
            border: 2px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .holiday-list {
            text-align: left;
            margin-bottom: 16px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }
        .holiday-list-empty {
            color: #999;
            font-size: 12px;
            padding: 14px 0;
            text-align: center;
        }
        .holiday-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .holiday-list-item .hli-info {
            flex: 1;
            min-width: 0;
        }
        .holiday-list-item .hli-date {
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .holiday-list-item .hli-name {
            font-weight: bold;
            color: #000;
            font-size: 12px;
            word-break: break-word;
        }
        .holiday-list-item .hli-delete {
            background-color: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 3px;
            width: 22px;
            height: 22px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
            font-size: 14px;
            padding: 0;
        }
        .holiday-list-item .hli-delete:hover {
            background-color: #b71c1c;
        }

        /* Box untuk modal Primbon Hari Ini */
        .primbon-box {
            width: 340px;
        }
        .primbon-section-title {
            margin-top: 14px;
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 10px;
            text-align: left;
        }
        .primbon-pantangan-list {
            text-align: left;
            font-size: 12px;
            color: #333;
            margin: 6px 0 0 18px;
            padding: 0;
        }
        .primbon-pantangan-list li {
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .primbon-acara-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .pa-nama {
            font-weight: bold;
            font-size: 12px;
            color: #000;
        }
        .pa-status {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 3px 9px;
            border-radius: 10px;
            color: #fff;
            white-space: nowrap;
        }
        .pa-status.pa-verygood {
            background-color: #1b5e20;
        }
        .pa-status.pa-good {
            background-color: #2e7d32;
        }
        .pa-status.pa-bad {
            background-color: #d32f2f;
        }
        .pa-status.pa-avoid {
            background-color: #7b0000;
        }
        .pa-ket {
            font-size: 10px;
            color: #777;
            text-align: left;
            margin-top: 2px;
            line-height: 1.3;
        }
        .primbon-disclaimer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            text-align: left;
            font-size: 9.5px;
            line-height: 1.5;
            color: #999;
        }
        /* Modal Primbon Cuaca */
        .cuaca-box {
            width: 360px;
        }
        .cuaca-date-row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin: 10px 0 4px 0;
        }
        .cuaca-date-row input {
            font-size: 13px;
            padding: 6px 8px;
            border: 2px solid #ccc;
            border-radius: 4px;
        }
        .cuaca-date-row button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            background-color: #ccc;

    <script>
        // --- DATA NEPTU ---
        const nilaiHari = {
            0: 5, // Minggu
            1: 4, // Senin
            2: 3, // Selasa
            3: 7, // Rabu
            4: 8, // Kamis
            5: 6, // Jumat
            6: 9 // Sabtu
        };
        const nilaiPasaran = {
            'Wage': 4,
            'Kliwon': 8,
            'Legi': 5,
            'Pahing': 9,
            'Pon': 7
        };

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function getNeptu(dayIndex, pasaranName) {
            return nilaiHari[dayIndex] + nilaiPasaran[pasaranName];
        }

        // --- FUNGSI PANCASUDA ---
        function getPancasuda(neptu) {
            const sisa = neptu % 5;
            let nama, keterangan, isGood;
            switch (sisa) {
                case 1:
                    nama = "Sri";
                    keterangan = "Kelimpahan rezeki";
                    isGood = true;
                    break;
                case 2:
                    nama = "Lungguh";
                    keterangan = "Kehormatan & wibawa";
                    isGood = true;
                    break;
                case 3:
                    nama = "Gedhong";
                    keterangan = "Kekayaan harta";
                    isGood = true;
                    break;
                case 4:
                    nama = "Lara";
                    keterangan = "Penyakit / kesialan";
                    isGood = false;
                    break;
                case 0:
                    nama = "Pati";
                    keterangan = "Musibah / kematian";
                    isGood = false;
                    break;
                default:
                    nama = "-";
                    keterangan = "-";
                    isGood = false;
            }
            return { sisa, nama, keterangan, isGood };
        }

        // --- DATA PRIMBON: PANTANGAN HARIAN (logika baku, berdasarkan hari & pasaran) ---
        const PANTANGAN_HARI = {
            0: "Hindari memulai urusan utang-piutang atau pinjam-meminjam.",
            1: "Hindari memulai pekerjaan besar sebelum matahari terbit.",
            2: "Hindari menebang pohon besar atau membongkar bangunan.",
            3: "Hindari bepergian jauh ke arah barat.",
            4: "Hindari menggelar acara besar di malam hari.",
            5: "Hindari memulai perjalanan jauh ke arah selatan.",
            6: "Hindari mengadakan perjalanan jauh ke arah utara."
        };

        const PANTANGAN_PASARAN = {
            'Legi': "Hindari bepergian ke arah selatan untuk urusan penting.",
            'Pahing': "Hindari menggelar hajatan besar atau pesta.",
            'Pon': "Hindari pindah rumah atau pindah tempat tinggal.",
            'Wage': "Hindari memulai usaha atau pekerjaan baru.",
            'Kliwon': "Hindari keluar malam hari tanpa keperluan mendesak."
        };

        // --- DATA PRIMBON: KELAYAKAN ACARA (berdasarkan kategori Pancasuda) ---
        const PRIMBON_ACARA_LIST = ['Pernikahan', 'Pindah Rumah', 'Membuka Usaha', 'Bepergian Jauh'];

        const PRIMBON_ACARA_MAP = {
            'Sri': {
                'Pernikahan': { status: 'baik', ket: 'Mendukung kelimpahan rezeki rumah tangga baru.' },
                'Pindah Rumah': { status: 'baik', ket: 'Membawa berkah rezeki di tempat tinggal baru.' },
                'Membuka Usaha': { status: 'sangat baik', ket: 'Dipercaya membawa kelancaran rezeki usaha.' },
                'Bepergian Jauh': { status: 'baik', ket: 'Perjalanan cenderung lancar dan membawa hasil baik.' }
            },
            'Lungguh': {
                'Pernikahan': { status: 'sangat baik', ket: 'Membawa kehormatan & wibawa bagi kedua mempelai.' },
                'Pindah Rumah': { status: 'baik', ket: 'Mendukung kedudukan & nama baik di lingkungan baru.' },
                'Membuka Usaha': { status: 'baik', ket: 'Mendukung kepercayaan & nama baik usaha.' },
                'Bepergian Jauh': { status: 'baik', ket: 'Cocok untuk urusan yang berkaitan dengan jabatan/kehormatan.' }
            },
            'Gedhong': {
                'Pernikahan': { status: 'baik', ket: 'Mendukung kemapanan harta rumah tangga.' },
                'Pindah Rumah': { status: 'sangat baik', ket: 'Dipercaya membawa kemapanan harta di rumah baru.' },
                'Membuka Usaha': { status: 'baik', ket: 'Mendukung penumpukan modal & aset usaha.' },
                'Bepergian Jauh': { status: 'baik', ket: 'Cocok untuk urusan jual-beli atau investasi.' }
            },
            'Lara': {
                'Pernikahan': { status: 'kurang baik', ket: 'Berpotensi membawa masalah kesehatan/emosi, sebaiknya dihindari.' },
                'Pindah Rumah': { status: 'kurang baik', ket: 'Rentan membawa ketidaknyamanan di tempat baru.' },
                'Membuka Usaha': { status: 'kurang baik', ket: 'Berpotensi menghadapi hambatan di awal usaha.' },
                'Bepergian Jauh': { status: 'hindari', ket: 'Rawan gangguan kesehatan atau kendala kecil di perjalanan.' }
            },
            'Pati': {
                'Pernikahan': { status: 'hindari', ket: 'Dipercaya membawa kesialan besar, sangat tidak dianjurkan.' },
                'Pindah Rumah': { status: 'hindari', ket: 'Dipercaya membawa musibah di tempat tinggal baru.' },
                'Membuka Usaha': { status: 'hindari', ket: 'Berisiko membawa kegagalan usaha.' },
                'Bepergian Jauh': { status: 'hindari', ket: 'Sangat tidak dianjurkan, risiko musibah dalam perjalanan.' }
            }
        };

        function statusToClass(status) {
            switch (status) {
                case 'sangat baik': return 'pa-verygood';
                case 'baik': return 'pa-good';
                case 'kurang baik': return 'pa-bad';
                case 'hindari': return 'pa-avoid';
                default: return '';
            }
        }

        function getPrimbonHariIni(year, month, d) {
            const targetDate = new Date(year, month, d);
            const dayOfWeek = targetDate.getDay();
            const p = getPasaran(targetDate);
            const neptu = getNeptu(dayOfWeek, p);
            const pancasuda = getPancasuda(neptu);

            const pantanganHari = PANTANGAN_HARI[dayOfWeek] || '-';
            const pantanganPasaran = PANTANGAN_PASARAN[p] || '-';
            const acaraMap = PRIMBON_ACARA_MAP[pancasuda.nama] || {};
            const acara = PRIMBON_ACARA_LIST.map(nama => {
                const info = acaraMap[nama] || { status: '-', ket: '-' };
                return { nama, status: info.status, ket: info.ket };
            });

            return { dayOfWeek, pasaran: p, neptu, pancasuda, pantanganHari, pantanganPasaran, acara };
        }

        function showPrimbonToday() {
            const today = new Date();
            showPrimbonDetail(today.getFullYear(), today.getMonth(), today.getDate());
        }

        function showPrimbonDetail(year, month, d) {
            const data = getPrimbonHariIni(year, month, d);
            const now = new Date();
            const isToday = now.getFullYear() === year && now.getMonth() === month && now.getDate() === d;

            const acaraHtml = data.acara.map(a => `
                <div class="primbon-acara-row">
                    <span class="pa-nama">${a.nama}</span>
                    <span class="pa-status ${statusToClass(a.status)}">${a.status}</span>
                </div>
                <div class="pa-ket">${a.ket}</div>
            `).join('');

            const html = `
                <h3>${isToday ? 'Primbon Hari Ini' : 'Primbon Tanggal'}</h3>
                <div class="tdd-daybig">${hari[data.dayOfWeek]}</div>
                <div class="tdd-dateline">${d} ${namaBulan[month]} ${year} &mdash; Weton ${hari[data.dayOfWeek]} ${data.pasaran}</div>

                <div class="primbon-section-title">Pantangan / Larangan</div>
                <ul class="primbon-pantangan-list">
                    <li>${data.pantanganHari}</li>
                    <li>${data.pantanganPasaran}</li>
                    ${!data.pancasuda.isGood ? `<li>Hindari memulai aktivitas besar atau mengambil keputusan penting hari ini (${data.pancasuda.nama} &mdash; ${data.pancasuda.keterangan}).</li>` : ''}
                </ul>

                <div class="primbon-section-title">Baik/Buruk untuk Acara</div>
                ${acaraHtml}

                <div class="primbon-disclaimer">
                    <strong>Catatan</strong>
                    Konten Primbon ini disajikan sebagai warisan budaya dan tradisi Jawa, bukan bagian dari ajaran atau tuntunan agama mana pun. Penanggalan, weton, neptu, dan pancasuda merupakan sistem petungan budaya leluhur yang diwariskan secara turun-temurun, bukan sumber hukum agama.
                    <br><br>
                    Keyakinan tentang baik-buruknya suatu hari, rezeki, jodoh, dan nasib sepenuhnya berada di tangan Tuhan Yang Maha Esa. Informasi di sini bersifat referensi budaya dan pelestarian tradisi, bukan untuk dijadikan sandaran utama dalam mengambil keputusan hidup.
                </div>

                <button class="btn-cancel" style="margin-top:16px;" onclick="closePrimbonModal()">Tutup</button>
            `;

            document.getElementById('primbonBox').innerHTML = html;
            document.getElementById('primbonModal').classList.add('active');
        }

        function closePrimbonModal() {
            document.getElementById('primbonModal').classList.remove('active');
        }

        // =====================================================================
        // JODOH & HARI BAIK NIKAH
        // Catatan: aturan petungan di bawah mengikuti metode yang umum beredar di
        // masyarakat Jawa; sumber primbon bisa berbeda-beda. Semua aturan ada di
        // konstanta berikut, jadi mudah disesuaikan.
        // =====================================================================

        // Kecocokan pasangan: (neptu pria + neptu wanita) % 8
        const JODOH_PETUNG = {
            1: { nama: 'Pegat',   tone: 'bad',  ket: 'Dipercaya rawan perselisihan hingga perpisahan; perlu banyak kesabaran dan saling pengertian.' },
            2: { nama: 'Ratu',    tone: 'good', ket: 'Dipercaya membawa wibawa; pasangan disegani dan dihormati orang sekitar.' },
            3: { nama: 'Jodoh',   tone: 'good', ket: 'Dipercaya saling cocok dan rukun dalam membina rumah tangga.' },
            4: { nama: 'Topo',    tone: 'mid',  ket: 'Dipercaya awal rumah tangga penuh prihatin, namun kelak membaik dan bahagia.' },
            5: { nama: 'Tinari',  tone: 'good', ket: 'Dipercaya mudah mendapat rezeki dan hidup berkecukupan.' },
            6: { nama: 'Padu',    tone: 'mid',  ket: 'Dipercaya kerap berselisih paham, tetapi mudah berdamai kembali.' },
            7: { nama: 'Sujanan', tone: 'bad',  ket: 'Dipercaya rawan godaan atau gangguan pihak ketiga; perlu saling menjaga kepercayaan.' },
            0: { nama: 'Pesthi',  tone: 'good', ket: 'Dipercaya tentram, rukun, dan langgeng hingga akhir hayat.' }
        };

        // Gabungan neptu pria + wanita + hari akad: % 4
        const GABUNGAN_NIKAH = {
            3: { nama: 'Sri',     skor: 3,  ket: 'rezeki lancar, rumah tangga tentram' },
            2: { nama: 'Gembili', skor: 2,  ket: 'rumah tangga subur dan rukun' },
            1: { nama: 'Gentho',  skor: 0,  ket: 'dipercaya kurang baik untuk keturunan' },
            0: { nama: 'Punggel', skor: -3, ket: 'dipercaya rawan perpisahan, sebaiknya dihindari' }
        };

        const SKOR_STATUS_ACARA = { 'sangat baik': 3, 'baik': 2, 'kurang baik': -1, 'hindari': -3 };

        // Bulan Jawa (urutan Hijriyah) yang umumnya dihindari untuk hajatan nikah
        const BULAN_HINDARI_NIKAH = { 1: 'Suro', 9: 'Pasa' };

        const JODOH_MAX_HARI = 731;
        const JODOH_MAX_TAMPIL = 60;
        let jodohLast = null;

        function toInputDate(d) {
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return d.getFullYear() + '-' + mm + '-' + dd;
        }

        function parseInputDate(str, afterMaghrib) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
            if (!m) return null;
            // Hari Jawa berganti saat Maghrib: lahir setelah Maghrib dihitung hari berikutnya
            return new Date(+m[1], +m[2] - 1, +m[3] + (afterMaghrib ? 1 : 0));
        }

        function getWetonInfo(date) {
            const dow = date.getDay();
            const pas = getPasaran(date);
            return { dow, pasaran: pas, neptu: getNeptu(dow, pas) };
        }

        function evaluasiHariNikah(date, neptuPria, neptuWanita) {
            const w = getWetonInfo(date);
            const pancasuda = getPancasuda(w.neptu);
            const infoAcara = (PRIMBON_ACARA_MAP[pancasuda.nama] || {})['Pernikahan'] || { status: 'kurang baik' };
            const gab = GABUNGAN_NIKAH[(neptuPria + neptuWanita + w.neptu) % 4];
            const hijri = masehiToHijriyah(date.getFullYear(), date.getMonth(), date.getDate());
            const bulanJawa = namaBulanSaka[hijri.month - 1] || '-';

            const skor = (SKOR_STATUS_ACARA[infoAcara.status] || 0) + gab.skor;
            let hindari = false;

            if (infoAcara.status === 'hindari' || infoAcara.status === 'kurang baik') hindari = true;
            if (gab.skor < 2) hindari = true;
            if (BULAN_HINDARI_NIKAH[hijri.month]) hindari = true;
            // Pasaran Pahing: pantangan hajatan besar/pesta (lihat PANTANGAN_PASARAN)
            if (w.pasaran === 'Pahing') hindari = true;

            let level = null;
            if (!hindari && skor >= 4) level = skor >= 5 ? 'sangat baik' : 'baik';

            return { date, w, pancasuda, gab, bulanJawa, skor, level };
        }

        function cariHariNikah(start, end, neptuPria, neptuWanita) {
            const hasil = [];
            const total = Math.round((Date.UTC(end.getFullYear(), end.getMonth(), end.getDate()) -
                                      Date.UTC(start.getFullYear(), start.getMonth(), start.getDate())) / 86400000);
            for (let i = 0; i <= total; i++) {
                const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                const ev = evaluasiHariNikah(d, neptuPria, neptuWanita);
                if (ev.level) hasil.push(ev);
            }
            return hasil;
        }

        // =====================================================================
        // PRIMBON CUACA (Pranata Mangsa)
        // Memakai data pranataMangsa yang sama dengan footer kalender.
        // =====================================================================
        function getMangsaUntukTanggal(date) {
            const t = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            for (let i = 0; i < pranataMangsa.length; i++) {
                const pm = pranataMangsa[i];
                for (const sy of [t.getFullYear() - 1, t.getFullYear()]) {
                    const ey = pm.em < pm.sm ? sy + 1 : sy;
                    const start = new Date(sy, pm.sm, pm.sd);
                    let end = new Date(ey, pm.em, pm.ed);
                    // Kawolu berakhir 28 Feb; di tahun kabisat, 29 Feb ikut Kawolu
                    if (pm.em === 1 && pm.ed === 28 && new Date(ey, 1, 29).getMonth() === 1) end = new Date(ey, 1, 29);
                    if (t >= start && t <= end) {
                        const total = Math.round((end - start) / 86400000) + 1;
                        const hariKe = Math.round((t - start) / 86400000) + 1;
                        return { index: i, pm, start, end, total, hariKe, sisa: total - hariKe };
                    }
                }
            }
            return null;
        }

        // Kecenderungan hujan per mangsa (urutan sama dengan pranataMangsa: Kasa..Sada).
        // Skala 0-4 disusun dari uraian cuaca tiap mangsa; ubah di sini bila perlu.
        const MANGSA_HUJAN = [0, 0, 0, 2, 3, 3, 4, 3, 2, 1, 0, 0];
        const LABEL_HUJAN = {
            0: 'Kemarau / cerah',
            1: 'Cenderung kering',
            2: 'Berawan, hujan sesekali',
            3: 'Sering hujan',
            4: 'Hujan lebat'
        };
        const PERKIRAAN_HARI = 30;

        function getPerkiraanCuaca(base, jumlahHari) {
            const grup = [];
            for (let i = 0; i < jumlahHari; i++) {
                const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
                const info = getMangsaUntukTanggal(d);
                if (!info) continue;
                const last = grup[grup.length - 1];
                if (last && last.index === info.index) {
                    last.akhir = d;
                } else {
                    grup.push({ index: info.index, pm: info.pm, level: MANGSA_HUJAN[info.index], awal: d, akhir: d });
                }
            }
            return grup;
        }

        function fmtRentangSingkat(a, b) {
            const m = d => namaBulan[d.getMonth()].slice(0, 3);
            if (a.getTime() === b.getTime()) return a.getDate() + ' ' + m(a);
            if (a.getMonth() === b.getMonth()) return a.getDate() + ' \u2013 ' + b.getDate() + ' ' + m(b);
            return a.getDate() + ' ' + m(a) + ' \u2013 ' + b.getDate() + ' ' + m(b);
        }

        function renderPerkiraanCuaca(base) {
            const grup = getPerkiraanCuaca(base, PERKIRAAN_HARI);
            if (!grup.length) return '';
            const awal = grup[0].level;
            const akhir = grup[grup.length - 1].level;
            let tren;
            if (akhir > awal) tren = 'Tren: udara cenderung makin basah menjelang akhir periode.';
            else if (akhir < awal) tren = 'Tren: udara cenderung makin kering menjelang akhir periode.';
            else tren = 'Tren: kondisi cenderung stabil sepanjang periode.';

            const items = grup.map(g => {
                const waspada = (g.pm.kejadian && g.pm.kejadian !== '-') ? `<div class="pa-ket">Waspada: ${g.pm.kejadian}</div>` : '';
                return `
                    <div class="cuaca-forecast-item">
                        <div class="cuaca-forecast-top">
                            <span class="cf-range">${fmtRentangSingkat(g.awal, g.akhir)}</span>
                            <span class="cw-badge cw-${g.level}">${LABEL_HUJAN[g.level]}</span>
                        </div>
                        <div class="pa-ket">Mangsa ${g.pm.nama} (${g.pm.id}) &middot; ${g.pm.angin}</div>
                        ${waspada}
                    </div>`;
            }).join('');

            return `
                <div class="primbon-section-title">Perkiraan Cuaca ${PERKIRAAN_HARI} Hari</div>
                <div class="cuaca-trend">${tren}</div>
                ${items}
            `;
        }

        function fmtTglCuaca(d) {
            return d.getDate() + ' ' + namaBulan[d.getMonth()] + ' ' + d.getFullYear();
        }

        function showCuaca(tglStr) {
            const date = tglStr ? parseInputDate(tglStr, false) : new Date();

                isi = `

                    <div class="tdd-grid">
                        <div class="tdd-row"><span class="tdd-label">Periode</span><span class="tdd-value">${fmtTglCuaca(info.start)} &ndash; ${fmtTglCuaca(info.end)}</span></div>

                    ${renderPerkiraanCuaca(base)}

                    <div class="primbon-section-title">Cuaca &amp; Angin</div>

                    <div class="primbon-section-title">Dampak &amp; Kegiatan Tani</div>
                    <ul class="primbon-pantangan-list">
                        <li>${pm.dampak}</li>
                        ${kejadian ? `<li>Kejadian: ${kejadian}</li>` : ''}

                    <div class="primbon-section-title">Mangsa Berikutnya</div>

                    ${daftar}
                `;
            }

            const html = `
                <h3>${isToday ? 'Primbon Cuaca Hari Ini' : 'Primbon Cuaca Tanggal'}</h3>
                <div class="tdd-daybig">${hari[base.getDay()]}</div>
                <div class="tdd-dateline">${fmtTglCuaca(base)} &mdash; ${hari[base.getDay()]} ${getPasaran(base)}</div>
                <div class="cuaca-date-row">

                    <button onclick="showCuaca()">Hari Ini</button>
                </div>
                ${isi}
                <div class="primbon-disclaimer">
                    <strong>Catatan</strong>
                    Pranata Mangsa adalah penanda musim tradisional Jawa untuk kalender pertanian. Perkiraan di atas hanya kecenderungan musiman berdasarkan mangsa, bukan ramalan cuaca harian. Kondisi sebenarnya dapat berbeda dari tahun ke tahun (misalnya karena El Ni\u00f1o/La Ni\u00f1a); untuk prakiraan cuaca terkini, rujuklah BMKG.
                    <br><br>
                    Konten ini disajikan sebagai warisan budaya dan tradisi Jawa, bukan bagian dari ajaran atau tuntunan agama mana pun.
                </div>
                <button class="btn-cancel" style="margin-top:16px;" onclick="closeCuacaModal()">Tutup</button>
            `;
            const box = document.getElementById('cuacaBox');
            box.innerHTML = html;
            document.getElementById('cuacaModal').classList.add('active');
        }

            document.getElementById('cuacaModal').classList.remove('active');
        }

        const namaBulan = ["JANUARI", "FEBRUARI", "MARET", "APRIL", "MEI", "JUNI", "JULI", "AGUSTUS", "SEPTEMBER", "OKTOBER", "NOVEMBER",
            "DESEMBER"
        ];
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const pasaran = ['Wage', 'Kliwon', 'Legi', 'Pahing', 'Pon'];

        const daftarWuku = [
            { no: 1, name: "Sinta" }, { no: 2, name: "Landhep" }, { no: 3, name: "Wukir" },
            { no: 4, name: "Kurantil" }, { no: 5, name: "Tolu" }, { no: 6, name: "Gumbreg" },
            { no: 7, name: "Warigalit" }, { no: 8, name: "Warigagung" }, { no: 9, name: "Julungwangi" },
            { no: 10, name: "Sungsang" }, { no: 11, name: "Galungan" }, { no: 12, name: "Kuningan" },
            { no: 13, name: "Langkir" }, { no: 14, name: "Mandasiya" }, { no: 15, name: "Julungpujud" },
            { no: 16, name: "Pahang" }, { no: 17, name: "Kuruwelut" }, { no: 18, name: "Marakeh" },
            { no: 19, name: "Tambir" }, { no: 20, name: "Medangkungan" }, { no: 21, name: "Maktal" },
            { no: 22, name: "Wuye" }, { no: 23, name: "Manahil" }, { no: 24, name: "Prangbakat" },
            { no: 25, name: "Bala" }, { no: 26, name: "Wugu" }, { no: 27, name: "Wayang" },
            { no: 28, name: "Kulawu" }, { no: 29, name: "Dukut" }, { no: 30, name: "Watugunung" }
        ];

        const namaTahunJawa = ["Alip", "Ehe", "Jimawal", "Je", "Dal", "Be", "Wawu", "Jimakir"];
        const namaBulanSaka = ["Suro", "Sapar", "Mulud", "Bakda Mulud", "Jumadilawal", "Jumadilakir", "Rejeb", "Ruwah", "Pasa", "Sawal",
            "Dulkangidah", "Besar"
        ];
        const namaBulanHijriyah = ["Muharram", "Safar", "Rabiul Awal", "Rabiul Akhir", "Jumadil Awal", "Jumadil Akhir", "Rajab",
            "Sya'ban", "Ramadhan", "Syawal", "Dzulqa'dah", "Dzulhijjah"
        ];

        let currentStartMonth, currentYear;

        function masehiToHijriyah(year, month, day) {
            let jd = gregorianToJulian(year, month + 1, day);
            return julianToHijri(jd);
        }

        function gregorianToJulian(year, month, day) {
            if (month <= 2) { year -= 1;
                month += 12; }
            let a = Math.floor(year / 100);
            let b = 2 - a + Math.floor(a / 4);
            let jd = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + b - 1524.5;
            return Math.floor(jd);
        }

        function julianToHijri(jd) {
            const ISLAMIC_EPOCH = 1948439.5;
            function islamicToJd(year, month, day) {
                return day + Math.ceil(29.5 * (month - 1)) + (year - 1) * 354 +
                    Math.floor((3 + 11 * year) / 30) + ISLAMIC_EPOCH - 1;
            }
            let jdHalf = Math.floor(jd) + 0.5;
            let year = Math.floor((30 * (jdHalf - ISLAMIC_EPOCH) + 10646) / 10631);
            let month = Math.min(12, Math.ceil((jdHalf - (29 + islamicToJd(year, 1, 1))) / 29.5) + 1);
            let day = Math.round(jdHalf - islamicToJd(year, month, 1) + 1);
            return { year: year, month: month, day: day };
        }

        function getTahunJawa(year, month, day = 15) {
            const hijri = masehiToHijriyah(year, month, day);
            const jawaYear = hijri.year + 512;
            const siklus = ((jawaYear - 1555) % 8 + 8) % 8;
            return { tahun: jawaYear, nama: namaTahunJawa[siklus] };
        }

        // Label Tahun Jawa untuk header: kalau 1 Suro jatuh di tengah bulan Masehi,
        // tampilkan dua tahun (mis. "1959 DAL / 1960 BE")
        function getTahunJawaLabel(year, month) {
            const last = new Date(year, month + 1, 0).getDate();
            const a = getTahunJawa(year, month, 1);
            const b = getTahunJawa(year, month, last);
            const fmt = t => t.tahun + ' ' + t.nama.toUpperCase();
            return a.tahun === b.tahun ? fmt(a) : fmt(a) + ' / ' + fmt(b);
        }

function getWinduSancaya(year) {
            const winduNames = ["Adi", "Kuntara", "Sangara", "Sancaya"];
            const anchorYear = 1869;
            let diff = year - anchorYear;
            if (diff < 0) { let cycles = Math.floor(Math.abs(diff) / 32) + 1;
                diff += cycles * 32; }
            let winduIndex = Math.floor(diff / 8) % 4;
            let winduKe = Math.floor(diff / 8) + 1;
            let winduName = winduNames[winduIndex];
            let startYear = anchorYear + (winduKe - 1) * 8;
            let endYear = startYear + 7;
            return { nama: winduName, ke: winduKe, tahunMulai: startYear, tahunAkhir: endYear };
        }

        // Bulan Jawa (Suro, Sapar, ...) mengikuti bulan Hijriyah pada hari pertama
        // dan hari terakhir bulan Masehi tsb.
        function getBulanSakaLabel(year, month) {
            const last = new Date(year, month + 1, 0).getDate();
            const h1 = masehiToHijriyah(year, month, 1);
            const h2 = masehiToHijriyah(year, month, last);
            const a = namaBulanSaka[h1.month - 1] || "-";
            const b = namaBulanSaka[h2.month - 1] || "-";
            return a === b ? a : a + ' - ' + b;
        }

        function getBulanHijriyah(year, month) {
            const h1 = masehiToHijriyah(year, month, 1);
            const h2 = masehiToHijriyah(year, month, new Date(year, month + 1, 0).getDate());

            return {
                name: h1.month === h2.month
                    ? namaBulanHijriyah[h1.month - 1]
                    : namaBulanHijriyah[h1.month - 1] + " - " + namaBulanHijriyah[h2.month - 1],
                year: h1.year === h2.year ? String(h1.year) : h1.year + " / " + h2.year
            };
        }

        function getEaster(year) {
            let a = year % 19,
                b = Math.floor(year / 100),
                c = year % 100;
            let d = Math.floor(b / 4),
                e = b % 4;
            let f = Math.floor((b + 8) / 25),
                g = Math.floor((b - f + 1) / 3);
            let h = (19 * a + b - d - g + 15) % 30;
            let i = Math.floor(c / 4),
                k = c % 4;
            let l = (32 + 2 * e + 2 * i - h - k) % 7;
            let m = Math.floor((a + 11 * h + 22 * l) / 451);
            let month = Math.floor((h + l - 7 * m + 114) / 31);
            let day = ((h + l - 7 * m + 114) % 31) + 1;
            return { day: day, month: month - 1 };
        }

        function getDynamicHolidays(year) {
            let holidays = [];
            let easter = getEaster(year);
            let easterDate = new Date(year, easter.month, easter.day);
            let goodFriday = new Date(easterDate);
            goodFriday.setDate(easterDate.getDate() - 2);
            holidays.push({ d: goodFriday.getDate(), m: goodFriday.getMonth(), name: "WAFAT ISA AL-MASIH" });
            let ascension = new Date(easterDate);
            ascension.setDate(easterDate.getDate() + 39);
            holidays.push({ d: ascension.getDate(), m: ascension.getMonth(), name: "KENAIKAN ISA AL-MASIH" });
            return holidays;
        }

        function getFixedHolidays(m) {
            const fixed = {
                0: [{ d: 1, name: "TAHUN BARU MASEHI" }],
                4: [{ d: 1, name: "HARI BURUH INTERNASIONAL" }],
                5: [{ d: 1, name: "HARI LAHIR PANCASILA" }],
                7: [{ d: 17, name: "HARI KEMERDEKAAN RI" }],
                11: [{ d: 25, name: "HARI RAYA NATAL" }]
            };
            return fixed[m] || [];
        }

        function getAllHolidays(year, month) {
            let allHolidays = [];
            getFixedHolidays(month).forEach(h => { allHolidays.push({ d: h.d, m: month, name: h.name }); });
            getDynamicHolidays(year).forEach(h => { if (h.m === month) allHolidays.push(h); });
            getManualHolidays().forEach(h => {
                if (h.year === year && h.month === month) {
                    allHolidays.push({ d: h.day, m: h.month, name: h.name });
                }
            });
            return allHolidays;
        }

        function isHoliday(year, month, day) {
            return getAllHolidays(year, month).some(h => h.d === day && h.m === month);
        }

        // --- FUNGSI WUKU ---
        // PATCH: patokan baru 1 November 2026 = Sinta
        function getWuku(year, month, day) {
            const baseDate = new Date(2026, 10, 1); // 1 November 2026
            const baseWukuIndex = 0;                // Sinta

            const targetDate = new Date(year, month, day);

            const diffDays = Math.round(
                (targetDate - baseDate) / 86400000
            );

            let wukuIndex =
                (baseWukuIndex + Math.floor(diffDays / 7)) % 30;

            if (wukuIndex < 0) wukuIndex += 30;

            return daftarWuku[wukuIndex];
        }

        function getWukuForWeek(year, month, weekIndex) {
            const startDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstDayOfWeek;
            if (weekIndex === 0) {
                firstDayOfWeek = 1;
            } else {
                // hari Minggu awal baris ke-weekIndex
                firstDayOfWeek = weekIndex * 7 - startDay + 1;
            }

            // Date otomatis meluber ke bulan berikutnya; kolom terakhir yang berisi
            // tanggal bulan depan ikut menampilkan wuku yang benar
            const wukuMain = getWuku(year, month, firstDayOfWeek);

            // PATCH: kolom minggu terakhir (index 4) bisa "menampung" 1-2 hari
            // titipan dari baris ke-6 pada bulan yang butuh 6 baris kalender
            // (lihat split-cell di getMonthData). Hari titipan itu selalu jatuh
            // di hari Minggu, yaitu awal wuku BARU, jadi labelnya perlu digabung
            // supaya tidak menampilkan wuku yang salah untuk hari-hari tsb.
            if (weekIndex === 4) {
                const totalCells = startDay + daysInMonth;
                if (totalCells > 35) {
                    const overflowFirstDay = firstDayOfWeek + 7;
                    if (overflowFirstDay <= daysInMonth) {
                        const wukuOverflow = getWuku(year, month, overflowFirstDay);
                        if (wukuOverflow.name !== wukuMain.name) {
                            return { name: wukuMain.name + ' / ' + wukuOverflow.name, split: true };
                        }
                    }
                }
            }

            return wukuMain;
        }

        function getPasaran(date) {
            const anchorDate = Date.UTC(1970, 0, 1);
            const targetDate = Date.UTC(
                date.getFullYear(),
                date.getMonth(),
                date.getDate()
            );

            const diffDays = Math.floor(
                (targetDate - anchorDate) / 86400000
            );

            const anchorPasaranIndex = 0; // Wage

            return pasaran[
                ((diffDays + anchorPasaranIndex) % 5 + 5) % 5
            ];
        }

        function getMangsaInfo(m, year) {
            let ringkas = "";
            let cuaca = "";
            let dampak = "";
            const monthStart = new Date(year, m, 1);
            const monthEnd = new Date(year, m + 1, 0);

            pranataMangsa.forEach(pm => {
                // cari tahun mulai (year-1 atau year) yang rentangnya beririsan dengan bulan ini
                let startYear = null, endYear = null, startDate, endDate;
                for (const sy of [year - 1, year]) {
                    const ey = pm.em < pm.sm ? sy + 1 : sy;
                    const s = new Date(sy, pm.sm, pm.sd);
                    const e = new Date(ey, pm.em, pm.ed);
                    if (s <= monthEnd && e >= monthStart) {
                        startYear = sy; endYear = ey; startDate = s; endDate = e;
                        break;
                    }
                }
                if (startYear === null) return;

                const diffDays = Math.round((endDate - startDate) / 86400000) + 1;
                const startStr = `${pm.sd} ${namaBulan[pm.sm]} ${startYear}`;
                const endStr = `${pm.ed} ${namaBulan[pm.em]} ${endYear}`;

                ringkas += `<div class="mangsa-item">
                        <strong>${pm.nama} (${pm.id})</strong> <span class="rentang">${diffDays} hr • ${startStr} - ${endStr}</span>
                        <span class="filosofi">“${pm.candra}”</span>
                    </div>`;

                cuaca +=
                    `<div class="mangsa-item"><span class="label">Cuaca:</span> ${pm.cuaca} | <span class="label">Angin:</span> ${pm.angin}</div>`;

                const kejadianText = (pm.kejadian && pm.kejadian !== "-") ?
                    ` <span class="label">Kejadian:</span> <span class="kejadian">${pm.kejadian}</span>` :
                    "";
                dampak +=
                    `<div class="mangsa-item"><span class="label">Dampak:</span> ${pm.dampak}${kejadianText}</div>`;
            });
            if (!ringkas) ringkas = "<span style='color:#999;'>Tidak ada</span>";
            if (!cuaca) cuaca = "<span style='color:#999;'>Tidak ada</span>";
            if (!dampak) dampak = "<span style='color:#999;'>Tidak ada</span>";
            return { ringkas, cuaca, dampak };
        }
