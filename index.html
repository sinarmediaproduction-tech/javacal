        function getMonthData(year, month) {
            const data = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startDay = new Date(year, month, 1).getDay();
            const prevDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < startDay; i++) data[i][0] = { date: prevDays - startDay + i + 1, type: 'prev' };

            for (let d = 1; d <= daysInMonth; d++) {
                let dayOfWeek = (startDay + d - 1) % 7;
                let weekCol = Math.floor((d + startDay - 1) / 7);
                let currentDate = new Date(year, month, d);
                let p = getPasaran(currentDate);
                let isHolidayToday = isHoliday(year, month, d);
                let neptu = getNeptu(dayOfWeek, p);
                let pancasuda = getPancasuda(neptu);
                let hijri = masehiToHijriyah(year, month, d);
                let hijriStr = hijri.day + '/' + hijri.month;

                if (weekCol === 5) {
                    let hijriSplit = masehiToHijriyah(year, month, d);
                    data[dayOfWeek][4].split = {
                        date: d,
                        type: 'current',
                        pasaran: p,
                        isSunday: dayOfWeek === 0,
                        isHoliday: isHolidayToday,
                        neptu: neptu,
                        pancasuda: pancasuda,
                        hijri: hijriSplit.day + '/' + hijriSplit.month
                    };
                } else {
                    data[dayOfWeek][weekCol] = {
                        date: d,
                        type: 'current',
                        pasaran: p,
                        isSunday: dayOfWeek === 0,
                        isHoliday: isHolidayToday,
                        neptu: neptu,
                        pancasuda: pancasuda,
                        hijri: hijriStr
                    };
                }
            }

            let nextD = 1;
            for (let dow = 0; dow <= 6; dow++) {
                for (let w = 0; w <= 4; w++) {
                    if (!data[dow][w]) data[dow][w] = { date: nextD++, type: 'next' };
                }
            }
            return data;
        }

        function renderCell(cellData, year, month) {
            if (!cellData) return `<div class="date-cell"></div>`;
            let classes = "";
            if (cellData.isSunday || cellData.isHoliday) {
                classes = "red-text";
            }

            if (cellData.type !== 'current') {
                return `<div class="date-cell"><span class="big-number faded-text ${classes}">${cellData.date}</span></div>`;
            }

            if (cellData.split) {
                let topClasses = cellData.isSunday || cellData.isHoliday ? "red-text" : "";
                let bottomClasses = cellData.split.isSunday || cellData.split.isHoliday ? "red-text" : "";
                let topHijri = cellData.hijri || "";
                let bottomHijri = cellData.split.hijri || "";

                let topPc = cellData.pancasuda || getPancasuda(cellData.neptu);
                let bottomPc = cellData.split.pancasuda || getPancasuda(cellData.split.neptu);
                let topJavClass = topPc.isGood ? "good-day" : "bad-day";
                let bottomJavClass = bottomPc.isGood ? "good-day" : "bad-day";

                const topClick = `showDayDetail(${year}, ${month}, ${cellData.date})`;
                const bottomClick = `showDayDetail(${year}, ${month}, ${cellData.split.date})`;

                return `
                    <div class="date-cell split-cell">
                        <span class="split-top-left ${topClasses}" onclick="${topClick}" style="cursor:pointer;">${cellData.date}</span>
                        <span class="split-hijri-top ${topClasses}" onclick="${topClick}" style="cursor:pointer;">${topHijri}</span>
                        <span class="split-jav-top ${topJavClass}" onclick="${topClick}" style="cursor:pointer;">${cellData.pasaran.toUpperCase()}</span>
                        <span class="split-bottom-right ${bottomClasses}" onclick="${bottomClick}" style="cursor:pointer;">${cellData.split.date}</span>
                        <span class="split-hijri-bottom ${bottomClasses}" onclick="${bottomClick}" style="cursor:pointer;">${bottomHijri}</span>
                        <span class="split-jav-bottom ${bottomJavClass}" onclick="${bottomClick}" style="cursor:pointer;">${cellData.split.pasaran.toUpperCase()}</span>
                    </div>
                `;
            }

            let combinedClass = (cellData.isSunday || cellData.isHoliday) ? "red-text" : "";
            let neptu = cellData.neptu || getNeptu(0, cellData.pasaran);
            let pancasuda = cellData.pancasuda || getPancasuda(neptu);
            let javClass = pancasuda.isGood ? "good-day" : "bad-day";
            let hijri = cellData.hijri || "";

            return `<div class="date-cell has-date" onclick="showDayDetail(${year}, ${month}, ${cellData.date})">
                <span class="big-number ${combinedClass}">${cellData.date}</span>
                <span class="hijri-date ${combinedClass}">${hijri}</span>
                <span class="jav-date ${javClass}">${cellData.pasaran.toUpperCase()}</span>
                <span class="neptu-label ${combinedClass}">${neptu}</span>
            </div>`;
        }

        let footerHeightCache = {};

        function computeMaxFooterHeight(year) {
            const wrapper = document.getElementById('calendarWrapper');
            const probeWidth = (wrapper && wrapper.offsetWidth) ? wrapper.offsetWidth : 1000;

            const probe = document.createElement('div');
            probe.style.position = 'absolute';
            probe.style.visibility = 'hidden';
            probe.style.pointerEvents = 'none';
            probe.style.left = '-9999px';
            probe.style.top = '0';
            probe.style.width = probeWidth + 'px';
            document.body.appendChild(probe);

            let maxH = 0;
            for (let pm1 = 0; pm1 < 12; pm1 += 2) {
                const py1 = year;
                const pm2 = (pm1 + 1) % 12;
                const py2 = (pm1 === 11) ? py1 + 1 : py1;

                const pHolidays1 = getHolidaysInfo(pm1, py1);
                const pHolidays2 = getHolidaysInfo(pm2, py2);
                const pMangsa = getMangsaInfo(pm1, py1);

                probe.innerHTML = `
                        <div class="footer">
                            <div class="footer-grid">
                                <div class="footer-col">
                                    <strong>LIBUR NASIONAL</strong><br>
                                    ${pHolidays1 || '<span style="color:#999;">Tidak ada</span>'}
                                </div>
                                <div class="footer-col center">
                                    <strong>PRANATA MONGSO</strong><br>
                                    ${pMangsa.ringkas}
                                </div>
                                <div class="footer-col center">
                                    <strong>Cuaca &amp; Angin</strong><br>
                                    ${pMangsa.cuaca}
                                </div>
                                <div class="footer-col center">
                                    <strong>Dampak &amp; Kejadian</strong><br>
                                    ${pMangsa.dampak}
                                </div>
                                <div class="footer-col" style="text-align: right;">
                                    <strong>LIBUR NASIONAL</strong><br>
                                    ${pHolidays2 || '<span style="color:#999;">Tidak ada</span>'}
                                </div>
                            </div>
                        </div>
                    `;

                const fEl = probe.querySelector('.footer');
                const h = fEl.offsetHeight;
                if (h > maxH) maxH = h;
            }

            document.body.removeChild(probe);
            return maxH;
        }

        function applyFixedFooterHeight(year) {
            if (footerHeightCache[year] == null) {
                const oldStyle = document.getElementById('fixedFooterStyle');
                if (oldStyle) oldStyle.remove();
                footerHeightCache[year] = computeMaxFooterHeight(year);
            }
            const maxH = footerHeightCache[year];

            const style = document.getElementById('fixedFooterStyle') || document.createElement('style');
            style.id = 'fixedFooterStyle';
            style.textContent = `.footer { height: ${maxH}px !important; box-sizing: border-box; overflow: hidden; }`;
            document.head.appendChild(style);

            return maxH;
        }

        function generateCalendar() {
            let m1 = currentStartMonth;
            let y1 = currentYear;
            let m2 = (m1 + 1) % 12;
            let y2 = (m1 === 11) ? y1 + 1 : y1;

            const dataM1 = getMonthData(y1, m1);
            const dataM2 = getMonthData(y2, m2);

            let tahunJawa1 = getTahunJawaLabel(y1, m1);
            let tahunJawa2 = getTahunJawaLabel(y2, m2);
            let windu1 = getWinduSancaya(y1);
            let windu2 = getWinduSancaya(y2);
            let saka1 = getBulanSakaLabel(y1, m1);
            let saka2 = getBulanSakaLabel(y2, m2);
            let hijri1 = getBulanHijriyah(y1, m1);
            let hijri2 = getBulanHijriyah(y2, m2);

            let wukuM1 = [];
            for (let w = 0; w < 5; w++) {
                wukuM1.push(getWukuForWeek(y1, m1, w));
            }

            let wukuM2 = [];
            for (let w = 0; w < 5; w++) {
                wukuM2.push(getWukuForWeek(y2, m2, w));
            }

            let tahunDisplay = (y1 === y2) ? y1 : y1 + ' / ' + y2;

            let html = `
                    <div class="header">
                        <div class="header-left">
                            <div class="month-title-btn" onclick="prevMonth()" title="Bulan Sebelumnya">
                                <span class="nav-arrow">&#9664;</span>
                                ${namaBulan[m1]}
                            </div>
                            <div class="month-info-left">
                                <div class="line1">${saka1.toUpperCase()}</div>
                                <div class="line2">${hijri1.name.toUpperCase()} ${hijri1.year} HIJRIYAH</div>
                                <div class="line3"><span class="tahun-jawa">${tahunJawa1}</span></div>
                            </div>
                        </div>
                        <div class="header-center">
                            <span class="year-title-btn" onclick="goToToday()" title="Klik untuk ke Hari Ini">${tahunDisplay}</span>
                            <div class="windu-sancaya">
                                WINDU ${windu1.nama.toUpperCase()} ${windu1.ke}
                                <span class="tahun-windu">(${windu1.tahunMulai}-${windu1.tahunAkhir})</span>
                            </div>
                        </div>
                        <div class="header-right">
                            <div class="month-title-btn" onclick="nextMonth()" title="Bulan Selanjutnya" style="flex-direction: row-reverse;">
                                ${namaBulan[m2]}
                                <span class="nav-arrow">&#9654;</span>
                            </div>
                            <div class="month-info-right">
                                <div class="line1">${saka2.toUpperCase()}</div>
                                <div class="line2">${hijri2.name.toUpperCase()} ${hijri2.year} HIJRIYAH</div>
                                <div class="line3"><span class="tahun-jawa">${tahunJawa2}</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="calendar-grid">
                        <div class="wuku-row">
                            ${wukuM1.map(w => `<div class="wuku-cell${w.split ? ' wuku-split' : ''}">${w.name.toUpperCase()}</div>`).join('')}
                            <div class="wuku-cell wuku-center">WUKU</div>
                            ${wukuM2.map(w => `<div class="wuku-cell${w.split ? ' wuku-split' : ''}">${w.name.toUpperCase()}</div>`).join('')}
                        </div>
                `;

            const dayNames = ["MINGGU", "SENIN", "SELASA", "RABU", "KAMIS", "JUMAT", "SABTU"];
            for (let row = 0; row < 7; row++) {
                for (let col = 0; col < 5; col++) {
                    let cellData = dataM1[row] && dataM1[row][col] ? dataM1[row][col] : null;
                    html += renderCell(cellData, y1, m1);
                }
                let dayClass = row === 0 ? "day-minggu" : "";
                let onclickAttr = row === 0 ? `onclick="openDatePicker()"` : "";
                if (row === 6) {
                    html +=
                        `<div class="day-name ${dayClass}" onclick="exportPDF()" id="sabtBtn" title="Klik untuk Download PDF" style="cursor:pointer;">SABTU</div>`;
                } else {
                    html += `<div class="day-name ${dayClass}" ${onclickAttr}>${dayNames[row]}</div>`;
                }
                for (let col = 0; col < 5; col++) {
                    let cellData = dataM2[row] && dataM2[row][col] ? dataM2[row][col] : null;
                    html += renderCell(cellData, y2, m2);
                }
            }

            html += `</div>`;

            let holidays1 = getHolidaysInfo(m1, y1);
            let holidays2 = getHolidaysInfo(m2, y2);
            let mangsa = getMangsaInfo(m1, y1);

            html += `
                    <div class="footer">
                        <div class="footer-grid">
                            <div class="footer-col">
                                <strong>LIBUR NASIONAL</strong><br>
                                ${holidays1 || '<span style="color:#999;">Tidak ada</span>'}
                            </div>
                            <div class="footer-col center">
                                <strong>PRANATA MONGSO</strong><br>
                                ${mangsa.ringkas}
                            </div>
                            <div class="footer-col center">
                                <strong>Cuaca &amp; Angin</strong><br>
                                ${mangsa.cuaca}
                            </div>
                            <div class="footer-col center">
                                <strong>Dampak &amp; Kejadian</strong><br>
                                ${mangsa.dampak}
                            </div>
                            <div class="footer-col" style="text-align: right;">
                                <strong>LIBUR NASIONAL</strong><br>
                                ${holidays2 || '<span style="color:#999;">Tidak ada</span>'}
                            </div>
                        </div>
                    </div>
                `;

            document.getElementById('calendarWrapper').innerHTML = html;
            applyFixedFooterHeight(y1);
            requestAnimationFrame(() => { if (typeof enforceRatio === 'function') enforceRatio(); });
        }

        // --- FUNGSI EXPORT PDF ---
        // --- EXPORT PDF (resolusi tinggi untuk master cetak) ---
        const PDF_TARGET_DPI = 600;   // target kerapatan piksel pada kertas
        const PDF_MIN_SCALE = 3;      // batas bawah kalau perangkat tidak kuat
        let isExportingPDF = false;

        // Uji apakah browser sanggup membuat canvas sebesar ini (iOS Safari diam-diam gagal > ~16 MP)
        function canvasSizeSupported(w, h) {
            try {
                if (w > 32000 || h > 32000) return false;
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                if (!ctx) return false;
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(w - 1, h - 1, 1, 1);
                const ok = ctx.getImageData(w - 1, h - 1, 1, 1).data[3] === 255;
                c.width = 0; c.height = 0;
                return ok;
            } catch (e) {
                return false;
            }
        }

        function showExportToast(text) {
            let t = document.getElementById('exportToast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'exportToast';
                t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
                    'background:#222;color:#fff;padding:10px 18px;border-radius:6px;font:600 13px Roboto,sans-serif;' +
                    'z-index:99999;box-shadow:0 2px 10px rgba(0,0,0,.35);max-width:90%;text-align:center;';
                document.body.appendChild(t);
            }
            t.textContent = text;
        }

        function hideExportToast() {
            const t = document.getElementById('exportToast');
            if (t) t.remove();
        }

        async function exportPDF() {
            if (isExportingPDF) return;
            isExportingPDF = true;

            const element = document.getElementById('calendarWrapper');

            const m2 = (currentStartMonth + 1) % 12;
            const filename = `Kalender-Jawa-${namaBulan[currentStartMonth]}-${namaBulan[m2]}-${currentYear}.pdf`;

            const pageW_mm = 280;
            const pageH_mm = 180;
            const margin_mm = 5;
            const availW_mm = pageW_mm - margin_mm * 2;
            const availH_mm = pageH_mm - margin_mm * 2;

            const calWidth = 1000;

            const prevWidth = element.style.width;
            const prevOverflow = element.style.overflow;
            const prevShadow = element.style.boxShadow;

            const stageEl = document.getElementById('stage');
            const boxEl = document.getElementById('stageBox');
            const prevStage = stageEl.style.transform;
            const prevBoxW = boxEl.style.width, prevBoxH = boxEl.style.height;
            const prevBodyMin = document.body.style.minWidth;

            const restoreLayout = () => {
                element.style.width = prevWidth;
                element.style.overflow = prevOverflow;
                element.style.boxShadow = prevShadow;
                stageFitDisabled = false;
                stageEl.style.transform = prevStage;
                boxEl.style.width = prevBoxW; boxEl.style.height = prevBoxH;
                document.body.style.minWidth = prevBodyMin;
                relayoutForCurrentWidth();
            };

            showExportToast('Menyiapkan PDF resolusi tinggi…');

            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;

                element.style.width = calWidth + 'px';
                element.style.overflow = 'visible';
                element.style.boxShadow = 'none';

                // lepas skala-muat layar sentuh agar html2canvas mengukur ukuran asli 1000px
                stageFitDisabled = true;
                stageEl.style.transform = 'none';
                boxEl.style.width = '1000px'; boxEl.style.height = '';
                document.body.style.minWidth = '1000px';

                // ukur ulang tinggi sel & footer untuk lebar 1000px (bukan lebar layar HP)
                relayoutForCurrentWidth();
                await new Promise(r => requestAnimationFrame(() => r()));

                const calHeight = Math.ceil(element.offsetHeight || 700);

                // ukuran gambar di kertas (mm per piksel CSS) -> skala untuk mencapai PDF_TARGET_DPI
                const fitCss = Math.min(availW_mm / calWidth, availH_mm / calHeight);
                const idealScale = fitCss / 25.4 * PDF_TARGET_DPI;

                // Skala dibulatkan KE ATAS ke bilangan bulat: kolom/baris sudah berukuran piksel CSS bulat,
                // jadi setiap garis jatuh tepat di piksel bulat PDF (tajam & lurus, tanpa anti-aliasing).
                // Turun 1 tingkat bila perangkat tidak sanggup.
                let scale = Math.ceil(idealScale);
                while (scale > PDF_MIN_SCALE &&
                    !canvasSizeSupported(calWidth * scale, calHeight * scale)) {
                    scale -= 1;
                }
                scale = Math.max(scale, PDF_MIN_SCALE);

                let canvas = null;
                let imgData = '';
                while (true) {
                    showExportToast(`Merender kalender (${Math.round(scale / fitCss * 25.4)} dpi)…`);
                    await new Promise(r => setTimeout(r, 30)); // beri kesempatan toast tampil

                    canvas = await html2canvas(element, {
                        scale: scale,
                        useCORS: true,
                        allowTaint: true,
                        letterRendering: true,
                        logging: false,
                        backgroundColor: '#ffffff',
                        width: calWidth,
                        height: calHeight,
                        scrollX: 0,
                        scrollY: -window.scrollY,
                        windowWidth: calWidth,
                        onclone: function(clonedDoc) {
                            const el = clonedDoc.getElementById('calendarWrapper');
                            if (el) {
                                el.style.boxShadow = 'none';
                                el.style.border = 'none';
                                el.style.width = calWidth + 'px';
                                el.style.overflow = 'visible';
                                el.style.height = 'auto';
                            }
                            clonedDoc.body.style.overflow = 'visible';
                            clonedDoc.body.style.height = 'auto';
                            const stg = clonedDoc.getElementById('stage');
                            if (stg) stg.style.transform = 'none';
                            const link = clonedDoc.createElement('link');
                            link.rel = 'stylesheet';
                            link.href =
                                'https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap';
                            clonedDoc.head.appendChild(link);
                        }
                    });

                    // kualitas maksimum (1.0) agar tidak ada artefak kompresi di teks kecil
                    imgData = canvas.toDataURL('image/jpeg', 1.0);

                    // canvas terlalu besar biasanya menghasilkan "data:," (kosong) -> ulangi dengan skala lebih kecil
                    if (imgData.length > 1000) break;
                    if (scale <= PDF_MIN_SCALE) throw new Error('Canvas kosong pada skala minimum');
                    scale = Math.max(PDF_MIN_SCALE, scale - 1);
                }

                restoreLayout();
                showExportToast('Menyusun file PDF…');
                await new Promise(r => setTimeout(r, 30));

                const canvasW = canvas.width;
                const canvasH = canvas.height;

                const fitScale = Math.min(availW_mm / canvasW, availH_mm / canvasH);
                const imgW_mm = canvasW * fitScale;
                const imgH_mm = canvasH * fitScale;
                const offsetX = (pageW_mm - imgW_mm) / 2;
                const offsetY = (pageH_mm - imgH_mm) / 2;
                const effectiveDpi = Math.round(canvasW / (imgW_mm / 25.4));

                const pdf = new window.jspdf.jsPDF({
                    unit: 'mm',
                    format: [pageW_mm, pageH_mm],
                    orientation: 'landscape',
                    compress: true
                });
                pdf.setProperties({
                    title: filename.replace(/\.pdf$/, ''),
                    subject: `Kalender Jawa - ${canvasW}x${canvasH} px, ±${effectiveDpi} dpi`
                });

                pdf.addImage(imgData, 'JPEG', offsetX, offsetY, imgW_mm, imgH_mm, undefined, 'NONE');
                pdf.save(filename);
                console.info(`PDF: ${canvasW}x${canvasH} px, ±${effectiveDpi} dpi`);

                // lepaskan memori canvas besar
                canvas.width = 0; canvas.height = 0;
            } catch (err) {
                restoreLayout();
                console.error('PDF Error:', err);
                alert('Gagal membuat PDF.\nCoba gunakan Ctrl+P → Save as PDF sebagai alternatif.');
            } finally {
                hideExportToast();
                isExportingPDF = false;
            }
        }

        function nextMonth() {
            currentStartMonth += 2;
            if (currentStartMonth > 11) { currentStartMonth -= 12;
                currentYear++; }
            generateCalendar();
        }

        function prevMonth() {
            currentStartMonth -= 2;
            if (currentStartMonth < 0) { currentStartMonth += 12;
                currentYear--; }
            generateCalendar();
        }

        // --- INISIALISASI ---
        function initCalendar() {
            const today = new Date();
            const todayMonth = today.getMonth();
            currentStartMonth = (todayMonth % 2 === 0) ? todayMonth : todayMonth - 1;
            if (currentStartMonth < 0) currentStartMonth = 0;
            currentYear = today.getFullYear();
            generateCalendar();
        }

        // --- ENFORCE RATIO ---
        function enforceRatio() {
            const wrapper = document.getElementById('calendarWrapper');
            if (!wrapper) return;

            const W = wrapper.offsetWidth;
            const targetH = Math.round(W * (180 / 280));

            // Lebar kolom dibulatkan ke piksel bulat supaya semua garis vertikal jatuh tepat di
            // piksel (tidak ada garis tebal-tipis / bergeser). Grid tanggal dan baris wuku memakai
            // track yang SAMA persis, sehingga pemisah wuku lurus dengan garis tanggal.
            const grid = wrapper.querySelector('.calendar-grid');
            let colsCss = '';
            if (grid) {
                const contentW = grid.offsetWidth - 1; // -1 = border-left grid
                const cum = [1, 2, 3, 4, 5, 6.5, 7.5, 8.5, 9.5, 10.5, 11.5]; // 5x1fr, 1.5fr, 5x1fr
                let prev = 0;
                const cols = cum.map(c => {
                    const edge = Math.round(c / 11.5 * contentW);
                    const w = edge - prev;
                    prev = edge;
                    return w + 'px';
                });
                colsCss = `.calendar-grid, .wuku-row { grid-template-columns: ${cols.join(' ')} !important; }`;
            }

            const style = document.getElementById('dynamicCellStyle') || document.createElement('style');
            style.id = 'dynamicCellStyle';
            style.textContent = colsCss;           // terapkan kolom dulu, lalu ukur tinggi
            document.head.appendChild(style);

            const header = wrapper.querySelector('.header');
            const wukuRow = wrapper.querySelector('.wuku-row');
            const footer = wrapper.querySelector('.footer');
            const headerH = header ? header.offsetHeight : 85;
            const wukuH = wukuRow ? wukuRow.offsetHeight : 18;
            const footerH = footer ? footer.offsetHeight : 55;

            const cellTotalH = targetH - headerH - wukuH - footerH - 4;
            const cellH = Math.floor(cellTotalH / 7);

            style.textContent = `${colsCss} .date-cell { height: ${cellH}px !important; }`;
            fitStage();
        }

        // Layar sentuh (HP/tablet): seluruh halaman diskalakan agar muat lebar layar, tampilan
        // tetap sama persis seperti di desktop (cubit-zoom tidak mengubah tata letak).
        // Desktop: tidak diskalakan sama sekali; zoom browser hanya membesar/mengecilkan.
        let stageFitDisabled = false;
        function fitStage() {
            if (stageFitDisabled) return;
            const box = document.getElementById('stageBox');
            const stage = document.getElementById('stage');
            if (!box || !stage) return;
            let sc = 1;
            if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
                const avail = document.documentElement.clientWidth - 36; // margin 8 + padding 10, kiri & kanan
                sc = Math.max(0.2, Math.min(1, avail / 1000));
            }
            if (sc < 1) {
                stage.style.transform = `scale(${sc})`;
                box.style.width = (1000 * sc) + 'px';
                box.style.height = (stage.offsetHeight * sc) + 'px';
                document.body.style.minWidth = '0';
            } else {
                stage.style.transform = '';
                box.style.width = '';
                box.style.height = '';
                document.body.style.minWidth = '';
            }
        }

        function relayoutForCurrentWidth() {
            footerHeightCache = {};
            applyFixedFooterHeight(currentYear);
            enforceRatio();
        }

        // Rotasi HP / resize jendela / zoom: kalender TIDAK digambar ulang (desain tetap);
        // hanya skala-muat layar sentuh yang dihitung ulang.
        let resizeTimer = null;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(fitStage, 100);
        });
        window.addEventListener('orientationchange', function() { setTimeout(fitStage, 250); });

        // --- PWA: service worker & tombol pasang aplikasi ---
        let deferredInstallPrompt = null;

        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            deferredInstallPrompt = e;
            const item = document.getElementById('installMenuItem');
            if (item) item.style.display = '';
        });

        window.addEventListener('appinstalled', function() {
            deferredInstallPrompt = null;
            const item = document.getElementById('installMenuItem');
            if (item) item.style.display = 'none';
        });

        function installApp() {
            if (!deferredInstallPrompt) return;
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.finally(function() {
                deferredInstallPrompt = null;
                const item = document.getElementById('installMenuItem');
                if (item) item.style.display = 'none';
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    console.warn('Service worker gagal didaftarkan:', err);
                });
            });
        }

        // Jalankan
        initCalendar();
        document.fonts.ready.then(() => { enforceRatio(); });
    </script>

</body>
</html>
